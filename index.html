<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple To-Do List</title>
        <link rel="stylesheet" href="./css/modern-normalize.css">
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>
        <header>
            <h1>To-Do List</h1>
            <nav>
                <ul>
                    <li><a href="./pages/how-to-use-this.html" target="_self">How to Use This</a></li>
                    <li><a href="./pages/planning-methods.html" target="_self">Planning Methods</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <h2>Add To-Do</h2>
                <div>
                    <input type="text" placeholder="Task">
                    <span class="button">+</span>
                </div>
            </section>
            <section>
                <h3>My To-Do</h3>
                <ol></ol>
            </section>
            <section>
                <h3>My Done-Do</h3>
                <ol class="doneDo"></ol>
            </section>
        </main>

        <footer></footer>
        <script src="./js/main.js"></script>
    </body>

</html>
